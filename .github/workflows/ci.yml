name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 24.x
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces
        run: pnpm build

      - name: Check types
        run: pnpm check

      - name: Run Node 20 runtime smoke tests
        if: matrix.node-version == '20.19.0'
        run: |
          pnpm --filter @mds-crate/parser test
          pnpm --filter @mds-crate/renderer-html test
          pnpm --filter @mds-crate/theme-loader test
          node packages/cli/dist/index.js --help

      - name: Run full test suite
        if: matrix.node-version == '24.x'
        run: pnpm test

      - name: Audit packed packages
        if: matrix.node-version == '24.x'
        run: pnpm check:packages

      - name: Run visual smoke test
        if: matrix.node-version == '24.x'
        run: pnpm test:visual

      - name: Run motion conformance smoke test
        if: matrix.node-version == '24.x'
        run: pnpm test:visual:motion

      - name: Run Rich extension smoke test
        if: matrix.node-version == '24.x'
        run: pnpm test:visual:rich
