<!-- Default accessible dialog structure. -->
<template data-block="dialog"><section{{ attrs }} class="dialog" role="dialog" aria-modal="true" aria-hidden="true" aria-label="{{ attr:label:Dialog }}">
  <button class="dialog-backdrop" type="button" tabindex="-1" aria-label="Close dialog" data-overlay-close></button>
  <div class="dialog-panel" tabindex="-1">
    <button class="dialog-close" type="button" aria-label="Close dialog" data-overlay-close>×</button>
    {{ children }}
    {{ slots }}
  </div>
</section>
</template>
