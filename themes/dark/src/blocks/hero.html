<!-- Dark theme editorial hero structure. -->
<template data-block="hero"><section{{ attrs }} class="hero">
  <div class="hero-copy">
    <p class="hero-eyebrow">{{ attr:eyebrow }}</p>
    <div class="hero-title">{{ slot:title }}</div>
    <div class="hero-body">{{ slot:body }}</div>
    <div class="hero-actions">{{ slot:actions }}</div>
    <div class="hero-flow">{{ children }}</div>
  </div>
  <div class="hero-media">{{ slot:media }}</div>
</section>
</template>
